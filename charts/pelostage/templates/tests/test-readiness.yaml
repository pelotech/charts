apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pelostage.fullname" . }}-test-readiness
  labels:
    {{- include "pelostage.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readiness
      image: "{{ .Values.utilityImage.repository }}:{{ .Values.utilityImage.tag }}"
      command:
        - wget
        - -q
        - -O-
        - http://{{ include "pelostage.fullname" . }}:{{ .Values.service.port }}/.backstage/health/v1/readiness
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
