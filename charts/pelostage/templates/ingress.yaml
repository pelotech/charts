{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pelostage.fullname" . }}
  labels:
    {{- include "pelostage.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ include "pelostage.ingressHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pelostage.fullname" . }}
                port:
                  name: http
  {{- with .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ include "pelostage.ingressHost" $ | quote }}
      secretName: {{ . }}
  {{- end }}
{{- end }}
