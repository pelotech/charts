{{- if not .Values.secrets.existingSecret }}
{{- $app := .Values.secrets.githubApp }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pelostage.fullname" . }}
  labels:
    {{- include "pelostage.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_ID: {{ $app.appId | quote }}
  CLIENT_ID: {{ $app.clientId | quote }}
  CLIENT_SECRET: {{ $app.clientSecret | quote }}
  WEBHOOK_SECRET: {{ $app.webhookSecret | quote }}
  PRIVATE_KEY: {{ $app.privateKey | quote }}
{{- end }}
