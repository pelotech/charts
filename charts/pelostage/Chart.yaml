apiVersion: v2
name: pelostage
description: Pelostage, a Backstage developer portal, for pelotech and client deployments
type: application
home: https://github.com/pelotech/pelostage

# chart version, managed by release-please
version: 0.1.0

# pelostage image tag (ghcr.io/pelotech/pelostage), kept current by renovate
appVersion: v0.2.0

sources:
  - https://github.com/pelotech/pelostage
  - https://github.com/pelotech/charts

dependencies:
  - name: cluster
    alias: cnpgCluster
    version: 0.9.0
    repository: https://cloudnative-pg.io/charts
    condition: cnpgCluster.enabled
