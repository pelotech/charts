{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lrsql.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "lrsql.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.commonAnnotations }}
  annotations:
    {{- tpl (merge (dict) .Values.ingress.annotations .Values.commonAnnotations | toYaml) $ | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostname }}
    - host: "{{ .Values.ingress.hostname }}"
      http:
        paths:
          {{- if .Values.ingress.extraPaths }}
          {{- toYaml .Values.ingress.extraPaths | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "lrsql.fullname" $ }}
                port:
                  name: {{ ternary "http" "https" (not $.Values.containerPorts.https) }}
    {{- else if .Values.ingress.path }}
    - http:
        paths:
          {{- if .Values.ingress.extraPaths }}
          {{- toYaml .Values.ingress.extraPaths | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "lrsql.fullname" $ }}
                port:
                  name: {{ ternary "http" "https" (not $.Values.containerPorts.https) }}
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ default "/" .path }}
            pathType: {{ default "ImplementationSpecific" .pathType }}
            backend:
              service:
                name: {{ include "lrsql.fullname" $ }}
                port:
                  name: {{ ternary "http" "https" (not $.Values.containerPorts.https) }}
    {{- end }}
    {{- if .Values.ingress.extraRules }}
    {{- tpl (toYaml .Values.ingress.extraRules) $ | nindent 4 }}
    {{- end }}
  {{- if or (and .Values.ingress.tls .Values.ingress.hostname) .Values.ingress.extraTls }}
  tls:
    {{- if and .Values.ingress.tls .Values.ingress.hostname }}
    - hosts:
        - {{ .Values.ingress.hostname | quote }}
        {{- if or (.Values.ingress.tlsWwwPrefix) (eq (index .Values.ingress.annotations "nginx.ingress.kubernetes.io/from-to-www-redirect") "true" ) }}
        - {{ printf "www.%s" (tpl .Values.ingress.hostname $) | quote }}
        {{- end }}
      secretName: {{ printf "%s-tls" .Values.ingress.hostname }}
    {{- end }}
    {{- if .Values.ingress.extraTls }}
    {{- tpl (toYaml .Values.ingress.extraTls) $ | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
