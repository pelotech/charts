---
name: docker-image
description: "build, push and sign a multi-arch image from images/<name>"
inputs:
  image:
    description: image name, matching a directory under images/
    required: true
  version:
    description: release version; empty publishes latest and the commit sha instead
    default: ''
  gh-token:
    description: github token for pushing to ghcr.io
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: 'v2.6.5'
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.gh-token }}
    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: metadata
      with:
        images: ghcr.io/pelotech/images/${{ inputs.image }}
        tags: |
          type=raw,value=latest,enable=${{ inputs.version == '' }}
          type=raw,value=${{ github.sha }},enable=${{ inputs.version == '' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      id: push
      with:
        context: ./images/${{ inputs.image }}
        file: ./images/${{ inputs.image }}/Dockerfile
        push: 'true'
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
    - name: sign the published image
      shell: bash
      env:
        TAGS: ${{ steps.metadata.outputs.tags }}
        DIGEST: ${{ steps.push.outputs.digest }}
      run: echo "${TAGS}" | xargs -I {} cosign sign --yes "{}@${DIGEST}"
