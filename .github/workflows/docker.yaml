name: Build Docker Images
# Publishes latest + commit sha for images changed on main. Versioned images are
# published by release-please.yaml when an image release is created.
on:
  push:
    branches:
      - main
    paths:
      - 'images/**'

permissions: {}

jobs:
  # Determine which image build contexts changed so we only rebuild those.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            goose: images/goose/**
            keyserver: images/keyserver/**

  docker:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/docker-image
        with:
          image: ${{ matrix.image }}
