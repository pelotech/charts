name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-output: ${{ steps.set-output.outputs.result }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: set-output
        env:
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        with:
          result-encoding: 'string'
          script: |
            return JSON.stringify(JSON.parse(process.env.RELEASE_OUTPUTS));

  publish:
    if: ${{ fromJSON(needs.release-please.outputs.releases_created) }}
    runs-on: ubuntu-latest
    needs: [release-please]
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: release
        env:
          RELEASE_OUTPUTS: ${{ needs.release-please.outputs.release-output }}
          CHART_PATH: ${{ matrix.path }}
        with:
          script: |
            var release = JSON.parse(process.env.RELEASE_OUTPUTS);
            var chartPath = process.env.CHART_PATH;
            var chartName = chartPath.split('/')[1];
            var chartVersion = release[`${chartPath}--version`];
            var gitTag = release[`${chartPath}--tag_name`]
            core.setOutput('chart-path', chartPath)
            core.setOutput('chart-name',chartName);
            core.setOutput('chart-version',chartVersion)
            core.setOutput('chart-git-tag', gitTag)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dependencies Helm - ${{ steps.release.outputs.chart-name }}
        uses: WyriHaximus/github-action-helm3@e3894d973c282349e3d41d3347767f2b2545b583 # v4.0.2
        with:
          exec: |
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo add cloudnative-pg https://cloudnative-pg.io/charts
            helm dependency build ${{matrix.path}}
      - name: Chart | Push - ${{ steps.release.outputs.chart-name }}
        uses: appany/helm-oci-chart-releaser@d94988c92bed2e09c6113981f15f8bb495d10943 # v0.5.0
        with:
          name: ${{ steps.release.outputs.chart-name }}
          repository: pelotech/charts
          tag: ${{ steps.release.outputs.chart-version }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.github_token }}
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - name: update docker images with annotations
        env:
          GIT_TAG: ${{ steps.release.outputs.chart-git-tag }}
          CHART_NAME: ${{ steps.release.outputs.chart-name }}
          CHART_VERSION: ${{ steps.release.outputs.chart-version }}
        run: |
          crane mutate -a "org.opencontainers.image.revision=${GIT_TAG},org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" "ghcr.io/pelotech/charts/${CHART_NAME}:${CHART_VERSION}"
